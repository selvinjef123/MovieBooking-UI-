
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <span class="text-danger">Movie</span>Booking
    </a>

    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="#">Home</a>
      <a class="nav-link" href="#movies">Movies</a>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero-section text-center">
  <div class="container">
    <h1>Welcome to Movie Booking</h1>
    <p>Book your favourite movie tickets online!</p>
    <a href="#movies" class="btn btn-danger btn-lg">
      Explore Movies
    </a>
  </div>
</section>

<!-- Movies Section -->
<div class="container my-5" id="movies">

  <h2 class="fw-bold mb-4">Now Showing</h2>

  <div class="row g-4">

    @for (movie of movies; track movie.title) {
      <div class="col-md-3">

        <div class="card shadow h-100">

          <div class="movie-poster">
            <h3>{{ movie.title }}</h3>
          </div>

          <div class="card-body">
            <h5 class="card-title">{{ movie.title }}</h5>

            <p class="text-muted mb-1">
              Genre: {{ movie.genre }}
            </p>

            <p class="text-muted">
              Duration: {{ movie.durationMinutes }} mins
            </p>

            <button class="btn btn-danger w-100">
              Book Tickets
            </button>
          </div>

        </div>

      </div>
    }

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  Movie Booking © 2026
</footer>

<router-outlet />
